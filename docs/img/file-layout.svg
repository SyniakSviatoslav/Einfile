<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="t d">
<!-- SPDX-License-Identifier: MIT OR Apache-2.0 -->
<title id="t">einfile: what one file holds</title>
<desc id="d">Two superblock pages, each with its PartTab, then an append-only arena of checksummed objects. The DOC root points to the event log, the KV tree, the per-device heads with their seals, the keys, an optional embedded reader, an anchor and the newest log segment.</desc>
<style>
  :root { --ink:#1f2328; --mute:#59636e; --line:#8c959f; --box:#f6f8fa; --edge:#d0d7de; --acc:#0969da; --accbg:#ddf4ff; --ok:#1a7f37; --okbg:#dafbe1; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#e6edf3; --mute:#9198a1; --line:#6e7681; --box:#161b22; --edge:#30363d; --acc:#4493f8; --accbg:#0c2d6b; --ok:#3fb950; --okbg:#0f2d1a; }
  }
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); font-size: 13px; }
  .m { fill: var(--mute); font-size: 12px; }
  .h { font-weight: 600; font-size: 14px; }
  .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
  .b { fill: var(--box); stroke: var(--edge); stroke-width: 1; }
  .a { fill: var(--accbg); stroke: var(--acc); stroke-width: 1.2; }
  .g { fill: var(--okbg); stroke: var(--ok); stroke-width: 1.2; }
  .l { stroke: var(--line); stroke-width: 1.2; fill: none; }
  .arr { fill: var(--line); }
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arr" d="M0 0L10 5L0 10z"/></marker></defs>

<text x="20" y="28" class="h">The container: one file, three regions</text>
<rect class="a" x="20" y="44" width="150" height="62" rx="4"/>
<text x="32" y="66" class="code">page 0</text><text x="32" y="84">superblock A</text><text x="32" y="99" class="m">+ its PartTab</text>
<rect class="a" x="178" y="44" width="150" height="62" rx="4"/>
<text x="190" y="66" class="code">page 1</text><text x="190" y="84">superblock B</text><text x="190" y="99" class="m">+ its PartTab</text>
<rect class="b" x="336" y="44" width="404" height="62" rx="4"/>
<text x="348" y="66" class="code">arena, from byte 8192</text>
<rect class="g" x="348" y="76" width="70" height="20" rx="2"/><rect class="g" x="422" y="76" width="44" height="20" rx="2"/><rect class="g" x="470" y="76" width="96" height="20" rx="2"/><rect class="g" x="570" y="76" width="56" height="20" rx="2"/>
<text x="636" y="91" class="m">append-only →</text>
<text x="20" y="128" class="m">A commit writes new objects, then the OTHER superblock. Two generations sit on different 4 KiB pages, so a torn page loses at most one.</text>
<text x="20" y="146" class="m">Every object: <tspan class="code">h0</tspan> = layout digest + length, <tspan class="code">h1</tspan> = crc32 of the payload + generation. A reader bounds every length by the file.</text>

<line class="l" x1="20" y1="166" x2="740" y2="166" stroke-dasharray="3 4"/>

<text x="20" y="194" class="h">The signed document: what the root points to</text>
<rect class="a" x="20" y="250" width="110" height="56" rx="4"/>
<text x="34" y="273" class="h">DOC</text><text x="34" y="292" class="m">root, version 5</text>

<g>
<path class="l" d="M130 278 H168" marker-end="url(#ar)"/>
<path class="l" d="M150 278 V222 H168" marker-end="url(#ar)"/>
<path class="l" d="M150 278 V334 H168" marker-end="url(#ar)"/>
<path class="l" d="M150 278 V390 H168" marker-end="url(#ar)"/>
<path class="l" d="M150 278 V446 H168" marker-end="url(#ar)"/>
</g>
<rect class="b" x="170" y="204" width="270" height="38" rx="4"/>
<text x="182" y="221" class="code">LOG</text><text x="222" y="221">the event log</text>
<text x="182" y="236" class="m">per-device chains: each record names its prev</text>
<rect class="b" x="170" y="259" width="270" height="38" rx="4"/>
<text x="182" y="276" class="code">TREE</text><text x="222" y="276">key-value state (KV v1–v4)</text>
<text x="182" y="291" class="m">a fold of the log; B+tree from v4</text>
<rect class="g" x="170" y="315" width="270" height="38" rx="4"/>
<text x="182" y="332" class="code">HEADS</text><text x="232" y="332">one row per device</text>
<text x="182" y="347" class="m">seq, tip id, and its SEAL</text>
<rect class="g" x="170" y="371" width="270" height="38" rx="4"/>
<text x="182" y="388" class="code">KEYS</text><text x="222" y="388">public keys, admits, revokes</text>
<text x="182" y="403" class="m">ML-DSA-65 keys, alg 65</text>
<rect class="b" x="170" y="427" width="270" height="38" rx="4"/>
<text x="182" y="444" class="code">SPEC · ANCH · SEG</text>
<text x="182" y="459" class="m">own reader + format text · anchor · newest cut</text>

<path class="l" d="M440 334 H478" marker-end="url(#ar)"/>
<rect class="g" x="480" y="300" width="260" height="96" rx="4"/>
<text x="492" y="321" class="code">SEAL</text><text x="532" y="321">one per device commit</text>
<text x="492" y="341" class="m">signs: "ein-seal/1" ‖ actor ‖ seq ‖ tip</text>
<text x="492" y="357" class="m">‖ claimed time ‖ previous tip</text>
<text x="492" y="377" class="m">→ a changed record moves the tip,</text>
<text x="492" y="391" class="m">and the seal over it goes bad</text>
<text x="480" y="222" class="m">Green: what a Verifier checks.</text>
<text x="480" y="240" class="m">Blue: what a crc checks; no reader</text>
<text x="480" y="256" class="m">without a Verifier can tell a forger</text>
<text x="480" y="272" class="m">who recomputed the crcs.</text>
</svg>
