# SPDX-License-Identifier: MIT OR Apache-2.0
# The whole benchmark table, by hand (Run workflow, or a push to `bench-run`), on a machine anyone can name. Manual only, and nothing depends
# on it: no gate reads this result, a red run blocks no merge and no release. The regression gate is
# tools/gates/einfile-bench.sh, a ratio; this is the table, absolute numbers.
#
# WHAT THIS RUNNER IS NOT: a shared GitHub-hosted x86 VM is not a NVMe lab machine. Its neighbours,
# its virtual disk and its CPU model change from run to run, so its fsync and cold-read rows say
# little, and two runs are not comparable to each other. It proves that the table reruns on a
# stranger's machine. The numbers a reader should quote come from one named machine with a real disk,
# by the same command, which the raw output's `# machine` lines describe.
name: einfile-bench-full
on:
  # A push to the branch `bench-run` runs the table with the defaults below, for a machine that holds
  # no API token: `git push origin HEAD:bench-run`. Still by hand, never on main.
  push:
    branches: [bench-run]
  workflow_dispatch:
    inputs:
      n:
        description: records (N)
        default: '100000'
      vs:
        description: value bytes (VS)
        default: '256'
      reps:
        description: repetitions, at least 5
        default: '5'
# contents: write only so the last step can push the raw output to the branch `bench-results`:
# artifacts and job logs need a signed-in account even on a public repo, a branch does not.
permissions:
  contents: write
jobs:
  full:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      N: ${{ inputs.n || '100000' }}
      VS: ${{ inputs.vs || '256' }}
      REPS: ${{ inputs.reps || '5' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: '1.96.1' }
      - name: The machine, as far as a guest can see it
        run: |
          for v in "$N" "$VS" "$REPS"; do case "$v" in ''|*[!0-9]*) echo "not a number: $v"; exit 2 ;; esac; done
          { echo '# a shared GitHub-hosted runner, not a NVMe lab machine: see this workflow header'
            lscpu; free -h; df -hT "$RUNNER_TEMP"; lsblk -o NAME,SIZE,ROTA,MODEL || true; uname -a
          } > machine.txt 2>&1
          cat machine.txt
      - name: full all
        working-directory: bench
        run: |
          set -o pipefail
          ES_BENCH_COMMIT="$GITHUB_SHA" ES_BENCH_DIR="$RUNNER_TEMP/einfile-bench-data" \
            cargo run --release --locked --features competitors,mldsa -- full all "$N" "$VS" "$REPS" \
            | tee "$GITHUB_WORKSPACE/einfile-bench-full.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: einfile-bench-full
          path: |
            machine.txt
            einfile-bench-full.txt
      - name: publish the raw output to the branch bench-results
        if: always()
        run: |
          d=$(mktemp -d); cp machine.txt einfile-bench-full.txt "$d"/ 2>/dev/null || true
          cd "$d" && git init -q && git checkout -q -b bench-results
          { echo "commit $GITHUB_SHA"; echo "run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; echo "N=$N VS=$VS REPS=$REPS"; } > RUN.txt
          git add -A && git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "bench: $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY" bench-results
