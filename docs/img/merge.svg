<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="t d">
<!-- SPDX-License-Identifier: MIT OR Apache-2.0 -->
<title id="t">einfile: merging two copies without a server</title>
<desc id="d">Two copies of one genesis grow apart on two devices. Doc::merge_into keeps every record and seal from both; when both sides wrote, the caller names the conflicts and signs them as a MERGE record, for a person to resolve. It refuses by name a cut, erasure or revocation on one side alone, a device forked across copies, and two seal chains of one key.</desc>
<style>
  :root { --ink:#1f2328; --mute:#59636e; --line:#8c959f; --box:#f6f8fa; --edge:#d0d7de; --acc:#0969da; --accbg:#ddf4ff; --ok:#1a7f37; --okbg:#dafbe1; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#e6edf3; --mute:#9198a1; --line:#6e7681; --box:#161b22; --edge:#30363d; --acc:#4493f8; --accbg:#0c2d6b; --ok:#3fb950; --okbg:#0f2d1a; }
  }
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); font-size: 13px; }
  .m { fill: var(--mute); font-size: 12px; }
  .h { font-weight: 600; font-size: 14px; }
  .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
  .b { fill: var(--box); stroke: var(--edge); stroke-width: 1; }
  .a { fill: var(--accbg); stroke: var(--acc); stroke-width: 1.2; }
  .g { fill: var(--okbg); stroke: var(--ok); stroke-width: 1.2; }
  .l { stroke: var(--line); stroke-width: 1.2; fill: none; }
  .arr { fill: var(--line); }
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arr" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="a" x="20" y="150" width="110" height="56" rx="4"/>
<text x="34" y="173" class="h">genesis</text><text x="34" y="192" class="m">one DOC, keys</text>

<path class="l" d="M130 170 C160 170 160 82 190 82" marker-end="url(#ar)"/>
<path class="l" d="M130 186 C160 186 160 274 190 274" marker-end="url(#ar)"/>

<rect class="b" x="192" y="40" width="250" height="84" rx="4"/>
<text x="204" y="61" class="h">copy A</text><text x="268" y="61" class="m">phone in the kitchen</text>
<rect class="g" x="204" y="72" width="34" height="18" rx="2"/><rect class="g" x="242" y="72" width="34" height="18" rx="2"/><rect class="g" x="280" y="72" width="34" height="18" rx="2"/>
<text x="322" y="86" class="m">device 1, seq 1–3</text>
<text x="204" y="112" class="code">price/salmon = 900</text>

<rect class="b" x="192" y="232" width="250" height="84" rx="4"/>
<text x="204" y="253" class="h">copy B</text><text x="268" y="253" class="m">laptop, offline</text>
<rect class="g" x="204" y="264" width="34" height="18" rx="2"/><rect class="g" x="242" y="264" width="34" height="18" rx="2"/>
<text x="284" y="278" class="m">device 2, seq 1–2</text>
<text x="204" y="304" class="code">price/salmon = 950</text>

<path class="l" d="M442 82 C480 82 480 170 512 170" marker-end="url(#ar)"/>
<path class="l" d="M442 274 C480 274 480 186 512 186" marker-end="url(#ar)"/>
<text x="446" y="96" class="code">merge_into</text>
<text x="460" y="272" class="m">by file: USB, mail, a shared folder</text>


<rect class="g" x="514" y="104" width="226" height="148" rx="4"/>
<text x="526" y="126" class="h">merged copy</text>
<text x="526" y="146" class="m">all 5 records, all seals, verbatim</text>
<text x="526" y="166" class="m">both sides wrote, so your code</text>
<text x="526" y="182" class="m">names the conflict:</text>
<text x="526" y="202" class="code">price/salmon 900 | 950</text>
<text x="526" y="222" class="m">and signs it as a MERGE record;</text>
<text x="526" y="238" class="m">a person resolves it later</text>

<line class="l" x1="20" y1="338" x2="740" y2="338" stroke-dasharray="3 4"/>
<text x="20" y="362" class="h">Refused by name, never guessed:</text>
<text x="20" y="384" class="m">a cut, an erasure or a revocation on one side alone · one device forked across the copies · two seal chains of one key</text>
</svg>
