# SPDX-License-Identifier: MIT OR Apache-2.0
name: Release

# Pushing a tag publishes the release. The notes are the committed file docs/releases/<tag>.md; a
# tag without one fails instead of publishing an empty release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: the notes exist for this tag
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ ! -s "$notes" ]; then
            echo "::error::no release notes at $notes; write them, commit, and move the tag"
            exit 1
          fi
      - name: create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "einfile $GITHUB_REF_NAME" \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md" \
            --verify-tag
